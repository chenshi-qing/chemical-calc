<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>计算工具箱</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
    <div class="max-w-md mx-auto">
        <div class="text-center mb-8 mt-4">
            <h1 class="text-2xl font-black text-gray-800">计算工具箱</h1>
            <p class="text-gray-500 text-sm mt-1">选择要使用的计算器</p>
        </div>

        <div class="space-y-3">
            <a href="feizhiCB.html" class="block bg-white p-4 rounded-2xl shadow-sm border border-gray-200 active:scale-[0.98] transition">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-100 text-blue-700 font-black rounded-xl flex items-center justify-center">瓦</div>
                    <div>
                        <div class="font-bold text-gray-900">42g 瓦楞纸原料成本</div>
                        <div class="text-xs text-gray-400">灰分 / 得率 / 综合成本</div>
                    </div>
                </div>
            </a>

            <a href="index.html" class="block bg-white p-4 rounded-2xl shadow-sm border border-gray-200 active:scale-[0.98] transition">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-purple-100 text-purple-700 font-black rounded-xl flex items-center justify-center">化</div>
                    <div>
                        <div class="font-bold text-gray-900">化学品计算器</div>
                        <div class="text-xs text-gray-400">原主页 · index.html</div>
                    </div>
                </div>
            </a>

            <a href="waste-paper-cost-calculator.html" class="block bg-white p-4 rounded-2xl shadow-sm border border-gray-200 active:scale-[0.98] transition">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-100 text-green-700 font-black rounded-xl flex items-center justify-center">废</div>
                    <div>
                        <div class="font-bold text-gray-900">废纸采购成本</div>
                        <div class="text-xs text-gray-400">常规采购价格核算</div>
                    </div>
                </div>
            </a>

            <a href="pulp-cost-calculator.html" class="block bg-white p-4 rounded-2xl shadow-sm border border-gray-200 active:scale-[0.98] transition">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 bg-orange-100 text-orange-700 font-black rounded-xl flex items-center justify-center">浆</div>
                    <div>
                        <div class="font-bold text-gray-900">湿浆 / 自制浆核算</div>
                        <div class="text-xs text-gray-400">电耗与流失率分析</div>
                    </div>
                </div>
            </a>
        </div>

        <p class="text-center text-gray-400 text-xs mt-10">
            建议只保存这一个页面到手机主屏幕<br>
            一个入口管理全部计算器
        </p>
    </div>
</body>
</html>
