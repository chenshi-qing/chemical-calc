<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 针对 iPhone 15 Pro Max 优化：禁止默认缩放，保证良好触控体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>42g瓦楞纸原料成本计算器</title>
    <!-- 引入 Tailwind CSS 用于快速UI布局 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Vue 3 用于数据双向绑定和实时计算 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        /* 强制 iOS 输入框不自动放大屏幕 */
        input { font-size: 16px !important; }
    </style>
</head>
<body>

<div id="app" class="pb-12 max-w-md mx-auto relative">
    
    <!-- 顶部固定控制栏 -->
    <div class="sticky top-0 z-10 bg-blue-600 text-white shadow-lg rounded-b-2xl mb-4">
        <div class="p-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold">原料成本计算器</h1>
                <button @click="resetToDefault" class="text-xs bg-blue-500/80 hover:bg-blue-700 active:bg-blue-800 text-white px-2.5 py-1 rounded-lg transition border border-blue-400/40">
                    重置默认值
                </button>
            </div>
            
            <!-- 全局目标参数 -->
            <div class="flex justify-between items-center text-sm bg-blue-700/60 p-2.5 rounded-xl border border-blue-400/30">
                <span class="opacity-90 font-medium">全局目标参数：</span>
                <div class="flex space-x-3">
                    <label class="flex items-center space-x-1">
                        <span class="text-xs opacity-80">纸灰分%</span>
                        <input type="number" inputmode="decimal" v-model.number="targetAsh" class="w-12 bg-white text-blue-900 px-1 py-0.5 rounded text-center font-bold">
                    </label>
                    <label class="flex items-center space-x-1">
                        <span class="text-xs opacity-80">纸水分%</span>
                        <input type="number" inputmode="decimal" v-model.number="targetMoisture" class="w-12 bg-white text-blue-900 px-1 py-0.5 rounded text-center font-bold">
                    </label>
                </div>
            </div>
            
            <div class="mt-2 text-[10px] text-blue-100/70 text-center">
                💡 修改任何数字自动保存到手机，下次打开直接生效
            </div>
        </div>
    </div>

    <!-- 卡片列表区 -->
    <div class="px-3 space-y-4">
        <div v-for="(item, index) in materials" :key="index" class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            
            <!-- 卡片头部：名称与最终成本 (高亮) -->
            <div class="flex justify-between items-center p-4 bg-gray-50/80 border-b border-gray-100">
                <div>
                    <span class="text-[11px] font-bold text-blue-600 bg-blue-100/80 px-2 py-0.5 rounded-md">{{ item.category }}</span>
                    <h2 class="text-lg font-bold text-gray-800 mt-1">{{ item.name }}</h2>
                </div>
                <div class="text-right">
                    <div class="text-[11px] text-gray-400 mb-0.5">综合成本 (元/吨)</div>
                    <div class="text-2xl font-black text-red-600 tracking-tight">{{ formatNum(calcTotal(item), 0) }}</div>
                </div>
            </div>

            <!-- 参数修改区 -->
            <div class="p-4">
                <div class="grid grid-cols-2 gap-x-3 gap-y-3 mb-4">
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 mb-1">现采购价格</label>
                        <input type="number" inputmode="decimal" v-model.number="item.price" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 mb-1">电耗成本</label>
                        <input type="number" inputmode="decimal" v-model.number="item.elec" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-800 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 mb-1">灰分 %</label>
                        <input type="number" inputmode="decimal" v-model.number="item.ash" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex flex-col">
                        <label class="text-xs text-gray-500 mb-1">水分 %</label>
                        <input type="number" inputmode="decimal" v-model.number="item.moisture" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="flex flex-col col-span-2">
                        <label class="text-xs text-gray-500 mb-1">综合流失 %</label>
                        <input type="number" inputmode="decimal" v-model.number="item.loss" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- 自动计算结果预览区 (只读) -->
                <div class="bg-blue-50/60 rounded-xl p-3 border border-blue-100">
                    <div class="grid grid-cols-3 gap-1 text-center divide-x divide-blue-200/60">
                        <div>
                            <div class="text-[10px] text-blue-600/80 mb-0.5">得率 %</div>
                            <div class="text-sm font-bold text-blue-950">{{ formatNum(calcYield(item), 1) }}</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-blue-600/80 mb-0.5">吨纸消耗(kg)</div>
                            <div class="text-sm font-bold text-blue-950">{{ formatNum(calcConsumption(item), 0) }}</div>
                        </div>
                        <div>
                            <div class="text-[10px] text-blue-600/80 mb-0.5">得率成本(元)</div>
                            <div class="text-sm font-bold text-blue-950">{{ formatNum(calcYieldCost(item), 0) }}</div>
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>

<script>
const { createApp } = Vue;

// 原始初始默认数据
const DEFAULT_MATERIALS = [
    { category: '白纸类', name: '混合白', ash: 31.0, moisture: 12.0, loss: 1.0, price: 2160, elec: 60 },
    { category: '白纸类', name: '国杂', ash: 25.0, moisture: 12.0, loss: 4.0, price: 2150, elec: 60 },
    { category: '白纸类', name: '混合国杂', ash: 25.0, moisture: 12.0, loss: 4.0, price: 2150, elec: 60 },
    { category: '白纸类', name: '低白双胶杂纸', ash: 26.0, moisture: 12.0, loss: 1.0, price: 2150, elec: 60 },
    { category: '白纸类', name: '工厂书边纸', ash: 27.5, moisture: 12.0, loss: 1.0, price: 2010, elec: 60 },
    { category: '白纸类', name: '无碳废纸', ash: 21.0, moisture: 12.0, loss: 4.5, price: 2030, elec: 60 },
    { category: '白纸类', name: '印花纸', ash: 9.3, moisture: 14.0, loss: 4.5, price: 2030, elec: 60 },
    { category: '白纸类', name: '保密局浆', ash: 22.0, moisture: 10.0, loss: 1.0, price: 1740, elec: 60 },
    { category: '黄板类', name: '坑卡', ash: 24.0, moisture: 12.0, loss: 14.0, price: 1880, elec: 60 },
    { category: '黄板类', name: '箱板纸A', ash: 22.0, moisture: 12.0, loss: 10.0, price: 2000, elec: 60 },
    { category: '黄板类', name: '箱板纸特级', ash: 19.0, moisture: 12.0, loss: 6.0, price: 2170, elec: 60 },
    { category: '湿浆类', name: '本色竹浆', ash: 5.0, moisture: 10.0, loss: 2.0, price: 2570, elec: 90 },
    { category: '湿浆类', name: '自制中温浆', ash: 3.5, moisture: 8.0, loss: 25.0, price: 1920, elec: 219 },
    { category: '湿浆类', name: '中温湿浆', ash: 3.5, moisture: 10.0, loss: 2.0, price: 2550, elec: 60 },
];

createApp({
    data() {
        return {
            targetAsh: 15,
            targetMoisture: 8,
            materials: JSON.parse(JSON.stringify(DEFAULT_MATERIALS))
        }
    },
    mounted() {
        // 打开时自动读取 iPhone 上之前修改过的数字
        const savedData = localStorage.getItem('paper_calc_materials');
        const savedTargets = localStorage.getItem('paper_calc_targets');
        if (savedData) {
            try { this.materials = JSON.parse(savedData); } catch(e) {}
        }
        if (savedTargets) {
            try {
                const t = JSON.parse(savedTargets);
                this.targetAsh = t.ash;
                this.targetMoisture = t.moisture;
            } catch(e) {}
        }
    },
    watch: {
        // 数据变动实时自动写入手机本地存储
        materials: {
            handler(newVal) {
                localStorage.setItem('paper_calc_materials', JSON.stringify(newVal));
            },
            deep: true
        },
        targetAsh() { this.saveTargets(); },
        targetMoisture() { this.saveTargets(); }
    },
    methods: {
        saveTargets() {
            localStorage.setItem('paper_calc_targets', JSON.stringify({
                ash: this.targetAsh,
                moisture: this.targetMoisture
            }));
        },
        // 重置按钮逻辑
        resetToDefault() {
            if(confirm('确定要恢复到原始图表默认值吗？所有修改将被覆盖。')) {
                this.targetAsh = 15;
                this.targetMoisture = 8;
                this.materials = JSON.parse(JSON.stringify(DEFAULT_MATERIALS));
                localStorage.removeItem('paper_calc_materials');
                localStorage.removeItem('paper_calc_targets');
            }
        },
        calcYield(item) {
            return 100 - (item.ash || 0) - (item.moisture || 0) - (item.loss || 0) + this.targetAsh + this.targetMoisture;
        },
        calcConsumption(item) {
            let yieldVal = this.calcYield(item);
            return yieldVal <= 0 ? 0 : 1000 / (yieldVal / 100);
        },
        calcYieldCost(item) {
            let yieldVal = this.calcYield(item);
            return yieldVal <= 0 ? 0 : (item.price || 0) / (yieldVal / 100);
        },
        calcTotal(item) {
            return this.calcYieldCost(item) + (item.elec || 0);
        },
        formatNum(num, fixed) {
            return Number(num || 0).toFixed(fixed);
        }
    }
}).mount('#app');
</script>
</body>
</html>
