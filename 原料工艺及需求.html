<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>原料工艺及需求核算工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 6px 6px 90px;
      font-size: 13px;
    }
    .container { max-width: 1000px; margin: 0 auto; }

    /* 顶部栏 */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; color: #fff;
      padding: 6px 10px; border-radius: 8px; margin-bottom: 8px;
    }
    .top-bar h1 { font-size: 0.95rem; font-weight: 700; }
    .top-bar a {
      font-size: 0.7rem; background: #334155; color: #cbd5e1;
      padding: 3px 8px; border-radius: 6px; text-decoration: none;
      border: 1px solid #475569;
    }
    .top-bar button {
      font-size: 0.7rem; background: #334155; color: #cbd5e1;
      padding: 3px 8px; border-radius: 6px; border: 1px solid #475569;
    }

    /* 折叠设置面板 */
    details.config-panel {
      background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
      padding: 6px 10px; margin-bottom: 8px;
    }
    details.config-panel summary {
      font-weight: 600; color: #475569; font-size: 0.8rem; cursor: pointer;
    }
    .top-inputs {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 6px; margin-top: 6px;
    }
    .input-group label { font-size: 0.68rem; color: #64748b; display: block; margin-bottom: 2px; }
    .input-group input {
      width: 100%; padding: 4px 6px; border: 1px solid #cbd5e1;
      border-radius: 5px; font-size: 16px; /* iOS 防缩放 */
    }

    /* 顶部快速汇总 */
    .top-summary {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 4px; margin-bottom: 8px;
    }
    .top-summary .box {
      background: #fff; border-radius: 6px; padding: 5px 4px;
      text-align: center; border: 1px solid #e2e8f0;
    }
    .top-summary label { font-size: 0.65rem; color: #64748b; display: block; }
    .top-summary span { font-size: 0.9rem; font-weight: bold; color: #0f172a; }
    .top-summary .red { color: #dc2626; }
    .top-summary .green { color: #059669; }

    /* 卡片列表 */
    .mobile-list { display: flex; flex-direction: column; gap: 6px; }
    .item-card {
      background: #fff; border-radius: 8px;
      padding: 6px 8px 7px; border-left: 3px solid #2563eb;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .card-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 5px;
    }
    .card-title { font-weight: bold; font-size: 0.9rem; }
    .card-tag {
      font-size: 0.65rem; background: #eff6ff; color: #2563eb;
      padding: 1px 5px; border-radius: 4px;
    }
    .card-cost {
      font-size: 0.85rem; font-weight: bold; color: #dc2626;
    }

    /* 卡片输入区 - 4列紧凑 */
    .card-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 3px; margin-bottom: 3px;
    }
    .field-box {
      background: #f8fafc; padding: 3px 4px; border-radius: 5px;
      text-align: center;
    }
    .field-box label { font-size: 0.62rem; color: #64748b; display: block; line-height: 1.1; }
    .field-box input {
      width: 100%; border: 1px solid #cbd5e1; border-radius: 3px;
      padding: 2px; font-size: 16px; /* iOS 防缩放 */
      font-weight: 600; text-align: center; background: #fff;
      margin-top: 1px;
    }
    .field-val {
      font-weight: bold; font-size: 0.85rem; margin-top: 2px; color: #0f172a;
    }
    .field-val.negative { color: #dc2626; }
    .field-val.positive { color: #059669; }

    /* 卡片底部只读输出行 */
    .card-outputs {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 3px; margin-top: 3px;
      background: #f1f5f9; padding: 4px; border-radius: 5px;
    }
    .card-outputs .field-box { background: transparent; padding: 0; }

    /* PC 端表格 */
    .pc-table-wrapper { display: none; }
    @media (min-width: 900px) {
      .mobile-list { display: none; }
      .pc-table-wrapper {
        display: block; overflow-x: auto; background: #fff;
        border-radius: 8px; padding: 10px;
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
      th, td { border: 1px solid #cbd5e1; padding: 5px 4px; text-align: center; }
      th { background-color: #f1f5f9; font-size: 0.75rem; }
      input.cell-input {
        width: 90%; padding: 3px; border: 1px solid #cbd5e1;
        border-radius: 4px; text-align: center; font-size: 13px;
      }
      td.negative { color: #dc2626; font-weight: bold; }
      tfoot td { background: #fef3c7; font-weight: bold; font-size: 0.85rem; }
    }

    /* 底部汇总栏（更紧凑，4 列） */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #0f172a; color: #fff;
      padding: 6px 8px;
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.2); z-index: 100;
    }
    .bar-stat { text-align: center; }
    .bar-stat label {
      font-size: 0.62rem; color: #94a3b8; display: block; line-height: 1.1;
    }
    .bar-stat span { font-size: 0.9rem; font-weight: bold; }
    .bar-stat .red { color: #f87171; }
    .bar-stat .green { color: #34d399; }
    .bar-stat .yellow { color: #fbbf24; }
  </style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <a href="home.html">← 工具箱</a>
    <h1>原料工艺及需求</h1>
    <button onclick="resetAll()">重置</button>
  </div>

  <!-- 折叠基础设置 -->
  <details class="config-panel">
    <summary>⚙️ 基础参数设置（排产/产能/装车量）</summary>
    <div class="top-inputs">
      <div class="input-group">
        <label>排产计划 (吨)</label>
        <input type="number" inputmode="decimal" id="planTons" value="9000" oninput="calculateAll()">
      </div>
      <div class="input-group">
        <label>产品产能 (吨/日)</label>
        <input type="number" inputmode="decimal" id="dailyCapacity" value="400" oninput="calculateAll()">
      </div>
      <div class="input-group">
        <label>装载量 (吨/车)</label>
        <input type="number" inputmode="decimal" id="truckCapacity" value="30" oninput="calculateAll()">
      </div>
    </div>
  </details>

  <!-- 顶部快速合计 -->
  <div class="top-summary">
    <div class="box">
      <label>日总用量</label>
      <span id="sumDaily">0</span>
    </div>
    <div class="box">
      <label>加权得率%</label>
      <span id="sumYield" class="green">0</span>
    </div>
    <div class="box">
      <label>加权成本(元/吨)</label>
      <span id="sumCost">0</span>
    </div>
    <div class="box">
      <label>缺口(吨)</label>
      <span id="sumDemand" class="red">0</span>
    </div>
  </div>

  <!-- 手机端：卡片列表视图 -->
  <div class="mobile-list" id="mobileList"></div>

  <!-- PC 端：表格视图 -->
  <div class="pc-table-wrapper">
    <table>
      <thead>
        <tr>
          <th>种类</th><th>名称</th><th>计划%</th>
          <th>价格(元/吨)</th><th>得率%</th>
          <th>包数</th><th>包重</th>
          <th>日用量(吨)</th><th>车数</th>
          <th>库存(吨)</th><th>可用天数</th>
          <th>缺口(吨)</th>
        </tr>
      </thead>
      <tbody id="pcTableBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="7">合计 / 加权平均</td>
          <td id="pcSumDaily">0</td>
          <td>-</td>
          <td id="pcSumStock">0</td>
          <td id="pcSumYield">-</td>
          <td id="pcSumDemand">0</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- 底部固定汇总 -->
<div class="bottom-bar">
  <div class="bar-stat">
    <label>日总用量</label>
    <span id="barDaily">0 吨</span>
  </div>
  <div class="bar-stat">
    <label>加权得率</label>
    <span id="barYield" class="green">0 %</span>
  </div>
  <div class="bar-stat">
    <label>加权成本</label>
    <span id="barCost" class="yellow">0</span>
  </div>
  <div class="bar-stat">
    <label>需求缺口</label>
    <span id="barDemand" class="red">0 吨</span>
  </div>
</div>
